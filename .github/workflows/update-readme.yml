name: Update README

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  push:
    branches: [main, master]
  workflow_dispatch:       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fill username and pull repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cat > _update_readme.py << 'PYEOF'
          import os
          import re
          import json
          import urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          repos = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}&type=owner",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          repos = [r for r in repos if not r["fork"] and not r["archived"]]
          repos.sort(key=lambda r: r["pushed_at"], reverse=True)

          if not repos:
              block = '<div align="center"><sub>No public repos found yet.</sub></div>'
          else:
              cards = []
              for r in repos:
                  img = (
                      "https://github-stats-extended.vercel.app/api/pin/"
                      f"?username={owner}&repo={r['name']}&theme=github_dark&hide_border=true"
                  )
                  cards.append(
                      f'<a href="{r["html_url"]}"><img width="400" src="{img}" alt="{r["name"]}" /></a>'
                  )
              rows_html = []
              for i in range(0, len(cards), 2):
                  pair = cards[i:i + 2]
                  cells = "".join(f'<td align="center">{c}</td>' for c in pair)
                  if len(pair) == 1:
                      cells += "<td></td>"
                  rows_html.append(f"<tr>{cells}</tr>")
              block = (
                  '<table align="center">\n<tbody>\n'
                  + "\n".join(rows_html)
                  + "\n</tbody>\n</table>"
              )

          with open("README.md", "r") as f:
              content = f.read()

          content = content.replace("YOUR_USERNAME", owner)

          content = re.sub(
              r"<!-- REPOS-START -->.*<!-- REPOS-END -->",
              f"<!-- REPOS-START -->\n{block}\n<!-- REPOS-END -->",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          PYEOF
          python3 _update_readme.py
          rm -f _update_readme.py

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update readme"
          git push
