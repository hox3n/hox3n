name: Update README

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  push:
    branches: [main]
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fill username and pull top repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import os, re, json, urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          repos = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}&type=owner",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          repos = [r for r in repos if not r["fork"] and not r["archived"]]
          repos.sort(key=lambda r: r["pushed_at"], reverse=True)

          if not repos:
              block = '<div align="center"><sub>No public repos found yet.</sub></div>'
          else:
              cards = []
              for r in repos:
                  img = (
                      "https://github-stats-extended.vercel.app/api/pin/"
                      f"?username={owner}&repo={r['name']}&theme=github_dark&hide_border=true"
                  )
                  cards.append(
                      f'<a href="{r["html_url"]}"><img height="150em" src="{img}" alt="{r["name"]}" /></a>'
                  )
              rows = ["\n".join(cards[i:i + 2]) for i in range(0, len(cards), 2)]
              block = '<div align="center">\n\n' + "\n<br/>\n".join(rows) + "\n\n</div>"

          with open("README.md", "r") as f:
              content = f.read()

          content = content.replace("YOUR_USERNAME", owner)

          content = re.sub(
              r"<!-- REPOS-START -->.*<!-- REPOS-END -->",
              f"<!-- REPOS-START -->\n{block}\n<!-- REPOS-END -->",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          EOF

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update pinned repos"
          git push
