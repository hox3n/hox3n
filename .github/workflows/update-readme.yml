name: Update README

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  push:
    branches: [main]
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fill username and pull top repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'EOF'
          import os, re, json, urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          repos = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f"https://api.github.com/users/{owner}/repos?per_page=100&page={page}&type=owner",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as resp:
                  batch = json.load(resp)
              if not batch:
                  break
              repos.extend(batch)
              page += 1

          repos = [r for r in repos if not r["fork"] and not r["archived"]]
          repos.sort(key=lambda r: r["pushed_at"], reverse=True)

          if not repos:
              block = '<div align="center"><sub>No public repos found yet.</sub></div>'
          else:
              header = "| Repository | Description | Language | ⭐ | Updated |\n"
              header += "|---|---|---|---|---|\n"
              rows = []
              for r in repos:
                  name = f'[{r["name"]}]({r["html_url"]})'
                  desc = (r["description"] or "").replace("|", "-")
                  lang = r["language"] or "—"
                  stars = r["stargazers_count"]
                  updated = r["pushed_at"][:10]
                  rows.append(f"| {name} | {desc} | {lang} | {stars} | {updated} |")
              block = header + "\n".join(rows)

          with open("README.md", "r") as f:
              content = f.read()

          content = content.replace("YOUR_USERNAME", owner)

          content = re.sub(
              r"<!-- REPOS-START -->.*<!-- REPOS-END -->",
              f"<!-- REPOS-START -->\n{block}\n<!-- REPOS-END -->",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w") as f:
              f.write(content)
          EOF

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update pinned repos"
          git push
